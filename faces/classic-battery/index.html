<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="meter">
        <div class="battery">
            <div class="battery-body">
                <div class="battery-inner">
                    <div class="battery-fill" id="fill">
                        <div class="fill-gradient"></div>
                        <div class="fill-shine"></div>
                    </div>
                </div>
                <div class="battery-gloss"></div>
                <div class="battery-bolt" id="bolt">⚡</div>
            </div>
            <div class="battery-tip">
                <div class="tip-shine"></div>
            </div>
        </div>
    </div>
    <script src="meter.js"></script>
</body>
</html>
