<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <svg id="nixie" height="22" aria-hidden="true">
        <defs>
            <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#2a201a"/>
                <stop offset="1" stop-color="#140e0b"/>
            </linearGradient>
            <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#3a2a20"/>
                <stop offset="0.35" stop-color="#1c120c"/>
                <stop offset="1" stop-color="#120b07"/>
            </linearGradient>
            <pattern id="mesh" width="1.5" height="1.5" patternUnits="userSpaceOnUse">
                <circle cx="0.75" cy="0.75" r="0.32" fill="#c9a27a"/>
            </pattern>
            <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="0.9"/>
            </filter>
        </defs>
        <rect id="body" class="panel" x="0.5" y="1" height="20" rx="3"/>
        <g id="content"></g>
    </svg>
    <script src="meter.js"></script>
</body>
</html>
