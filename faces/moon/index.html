<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="meter">
        <svg id="moon" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">
            <defs>
                <radialGradient id="litFill" cx="0.42" cy="0.38" r="0.68">
                    <stop offset="0" style="stop-color: var(--lit-hi)"/>
                    <stop offset="1" style="stop-color: var(--lit-lo)"/>
                </radialGradient>
                <radialGradient id="darkFill" cx="0.42" cy="0.38" r="0.7">
                    <stop offset="0" style="stop-color: var(--dark-hi)"/>
                    <stop offset="1" style="stop-color: var(--dark-lo)"/>
                </radialGradient>
                <clipPath id="disc"><circle cx="10" cy="10" r="8.6"/></clipPath>
                <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
                    <feGaussianBlur stdDeviation="0.45"/>
                </filter>
            </defs>
            <circle cx="10" cy="10" r="8.6" fill="url(#darkFill)"/>
            <g clip-path="url(#disc)">
                <g filter="url(#soft)">
                    <path id="lit" fill="url(#litFill)" d=""/>
                </g>
                <g class="maria">
                    <ellipse cx="7.2" cy="7.4" rx="2.4" ry="1.9"/>
                    <ellipse cx="11.6" cy="6.2" rx="1.6" ry="1.3"/>
                    <ellipse cx="12.4" cy="10.6" rx="2.1" ry="1.7"/>
                    <ellipse cx="8.4" cy="12.6" rx="1.3" ry="1.1"/>
                    <circle cx="10.6" cy="15.2" r="0.8"/>
                    <circle cx="14.8" cy="7.8" r="0.6"/>
                </g>
            </g>
            <circle class="rim" cx="10" cy="10" r="8.6"/>
            <path id="bolt" class="bolt" d="M16.6 11.4 L14.2 15.4 H15.9 L15.2 18.6 L17.9 14.2 H16.1 Z"/>
        </svg>
        <span id="value"></span>
    </div>
    <script src="meter.js"></script>
</body>
</html>
