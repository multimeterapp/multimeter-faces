<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <svg id="gauge" viewBox="0 0 30 20" width="30" height="20" aria-hidden="true">
        <defs>
            <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#fffaf0"/>
                <stop offset="1" stop-color="#ece0c4"/>
            </linearGradient>
            <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#fff" stop-opacity="0.75"/>
                <stop offset="1" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
            <clipPath id="clip"><rect x="0.5" y="0.5" width="29" height="19" rx="3.5"/></clipPath>
        </defs>
        <rect class="bezel" x="0.5" y="0.5" width="29" height="19" rx="3.5"/>
        <rect x="1.5" y="1.5" width="27" height="17" rx="2.6" fill="url(#face)"/>
        <g clip-path="url(#clip)">
            <path id="track" class="track" d=""/>
            <path id="fillArc" class="fill-arc" d=""/>
            <path id="warnZone" class="zone warn" d=""/>
            <path id="critZone" class="zone crit" d=""/>
            <g id="ticks"></g>
            <path id="bolt" class="bolt" d="M6.4 11.2 L4.6 14.3 L5.9 14.3 L5.3 16.6 L7.3 13.4 L6 13.4 Z"/>
            <g id="needle">
                <line x1="15" y1="17.2" x2="15" y2="5.2" class="needle-line"/>
            </g>
            <circle cx="15" cy="17.2" r="1.7" class="pivot"/>
            <rect x="1.5" y="1.5" width="27" height="7" rx="2.6" fill="url(#glass)" opacity="0.7"/>
        </g>
    </svg>
    <script src="meter.js"></script>
</body>
</html>
